; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3usbotg
src_dir = src
include_dir = include

[common]
lib_deps = 
	fastled/FastLED@^3.10.3
	pfeerick/elapsedMillis@^1.0.6
	tzapu/WiFiManager@^2.0.17
	ropg/ezTime@^0.8.3
	pololu/VL53L0X@^1.3.1
	bodmer/TFT_eSPI@^2.5.43
	adafruit/Adafruit LSM6DS@^4.7.4
	adafruit/Adafruit LIS3MDL@^1.2.5
	adafruit/Adafruit Sensor Calibration@^1.1.5
	adafruit/Adafruit AHRS@^2.4.0

[env:esp32s3usbotg]
platform = espressif32
;board = 4d_systems_esp32s3_gen4_r8n16
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
build_flags = 
	'-D EZTIME_LANGUAGE=FR'
	'-D LANG_FR'
	'-D SERIAL_BAUD=115200'
	'-D BOARD_LED_PIN=48'
	'-D SENSORS_SDA_PIN=1'
	'-D SENSORS_SCL_PIN=2'
	'-D SENSORS_I2C_SPEED=400000'
	'-D PCA9548A_RESET_PIN=42'
	'-D PCA9548A_ADDRESS=0x70'
	'-D VL53L0x_ADDRESS=0x52'
	'-D VL53L0x_TIMEOUT=20'
	'-D LSM6DS3_ADDRESS=0x6A'
	'-D LIS3MDL_ADDRESS=0x1C'
	'-D USER_SETUP_LOADED=1'
	'-D ILI9341_DRIVER=1'
	'-D USE_FSPI_PORT'
	'-D TFT_WIDTH=240'
	'-D TFT_HEIGHT=320'
	'-D TFT_BL=18'
	'-D TFT_BACKLIGHT_ON'
	'-D TFT_DC=9'
	'-D TFT_RST=8'
	'-D TFT_MISO=13'
	'-D TFT_SCLK=12'
	'-D TFT_MOSI=11'
	'-D TFT_CS=10'
	'-D SPI_FREQUENCY=40000000'
	'-D SPI_READ_FREQUENCY=6000000'
	'-D SPI_TOUCH_FREQUENCY=2500000'
	'-D SMOOTH_FONT=1'
	'-D LOAD_GLCD=1'
	'-D LOAD_FONT2=1'
	'-D LOAD_FONT4=1'
	'-D LOAD_FONT6=1'
	'-D LOAD_FONT7=1'
	'-D LOAD_FONT8=1'
	'-D LOAD_GFXFF=1'
	'-D TOUCH_CS=14'
	'-D MOTOR_A1_PIN=40'
	'-D MOTOR_A2_PIN=41'
	'-D MOTOR_B1_PIN=38'
	'-D MOTOR_B2_PIN=48'
	'-D MOTOR_PWM1_PIN=42'
	'-D MOTOR_PWM2_PIN=47'
	'-D MOTOR_STANDBY_PIN=39'

lib_deps = 
	${common.lib_deps}
